
version: 2

models:
  - name: fct_sales
    description: >
      Core sales fact table developed as part of DataForge,
      an end-to-end retail analytics platform by Rania Boudjemadi.
      Combines validated order transactions with customer and
      product attributes to calculate revenue, product costs,
      and estimated gross profit.
    columns:
      - name: order_id
        description: "Unique identifier for each retail order."
        data_tests:
          - unique
          - not_null

      - name: order_date
        description: "Date on which the order was placed."

      - name: customer_id
        description: "Identifier linking the order to a customer."

      - name: region
        description: "Geographic region associated with the customer."

      - name: customer_segment
        description: "Customer classification such as Consumer, SMB or Enterprise."

      - name: product_id
        description: "Identifier linking the order to a product."

      - name: category
        description: "Product category."

      - name: quantity
        description: "Number of product units ordered."

      - name: revenue
        description: "Revenue generated by the order."

      - name: total_cost
        description: "Estimated product cost calculated as quantity multiplied by unit cost."

      - name: estimated_profit
        description: "Revenue minus estimated product cost, excluding other expenses."

  - name: mart_daily_sales
    description: >
      Daily sales reporting table containing order counts,
      units sold, revenue, estimated costs, estimated profit,
      and average order value.

  - name: mart_category_performance
    description: >
      Product category performance table comparing order volumes,
      revenue, estimated profit, and estimated profit margins.

  - name: mart_customer_segments
    description: >
      Customer segmentation analytics table showing customer counts,
      order volumes, revenue, estimated profit, and revenue per customer.
