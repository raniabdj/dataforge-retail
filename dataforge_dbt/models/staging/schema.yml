
version: 2

models:
  - name: stg_orders
    description: "Cleaned retail order records."
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null

      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id

      - name: order_date
        data_tests:
          - not_null

      - name: revenue
        data_tests:
          - not_null

      - name: quantity
        data_tests:
          - not_null

  - name: stg_customers
    description: "Standardised customer information."
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null

  - name: stg_products
    description: "Standardised product information."
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null
